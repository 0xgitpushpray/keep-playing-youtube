<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Keep Playing for YouTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>Keep Playing</h1>
  </header>

  <label class="row">
    <span>Auto-continue playback</span>
    <input type="checkbox" id="enabled" role="switch">
  </label>

  <p class="stat"><span id="dismissed">0</span> prompts dismissed</p>

  <p class="hint">Works on YouTube and YouTube Music. Reload open tabs after installing.</p>

  <script src="popup.js"></script>
</body>
</html>
